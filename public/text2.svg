  <text x="" y="17.04"  class="fil0 fnt0">It is about questioning how reality is </text>
  <text x="" y="31.8"  class="fil0 fnt0">perceived.For Dito, every difficult experience </text>
  <text x="" y="46.55"  class="fil0 fnt0">contains the possibility of becoming something </text>
  <text x="" y="61.3"  class="fil0 fnt0">else: a new perspective, a moment of calm, an </text>
  <text x="" y="76.05"  class="fil0 fnt0">idea, or a form of growth. His work emerges </text>
  <text x="" y="90.81"  class="fil0 fnt0">from this constant process of observation and </text>
  <text x="" y="105.56"  class="fil0 fnt0">transformation.Belgrade — the White City — </text>
  <text x="" y="120.31"  class="fil0 fnt0">becomes both subject and canvas. A city </text>
  <text x="" y="135.06"  class="fil0 fnt0">carrying its own history and wounds, yet </text>
  <text x="" y="149.82"  class="fil0 fnt0">constantly changing. Through his interventions, </text>
  <text x="" y="164.57"  class="fil0 fnt0">Dito imagines new possibilities for the places </text>
  <text x="" y="179.32"  class="fil0 fnt0">and people he encounters, leaving his own </text>
  <text x="" y="194.08"  class="fil0 fnt0">visual trace upon the city.At the center of DTO&apos;s </text>
  <text x="" y="208.83"  class="fil0 fnt0">work is the human being: the possibility of </text>
  <text x="" y="223.58"  class="fil0 fnt0">seeing oneself differently. His art seeks to </text>
  <text x="" y="238.33"  class="fil0 fnt0">awaken self-awareness, personal power, and </text>
  <text x="" y="253.09"  class="fil0 fnt0">the courage to transform one&apos;s own </text>
  <text x="" y="267.84"  class="fil0 fnt0">perception.His expression is not born from an </text>
  <text x="" y="282.59"  class="fil0 fnt0">academic institution, but from experience, </text>
  <text x="" y="297.34"  class="fil0 fnt0">intuition, and a deeply human search for inner </text>
  <text x="" y="312.1"  class="fil0 fnt0">peace.A documented reality. A transformed </text>
  <text x="" y="326.85"  class="fil0 fnt0">memory. An altered perception.DTO is an </text>
  <text x="" y="341.6"  class="fil0 fnt0">invitation to look again.Because sometimes, </text>
  <text x="" y="356.35"  class="fil0 fnt0">changing the way we see the world is the first </text>
  <text x="" y="371.11"  class="fil0 fnt0">step toward changing the world within us.</text>
 </g>
</svg>
