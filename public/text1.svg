 <g id="Layer_x0020_1">
  <metadata id="CorelCorpID_0Corel-Layer"/>
  <text x="" y="624.41"  class="fil0 fnt0">IS THE ARTISTIC IDENTITY OF CUBAN PHOTOGRAPHER AND VISUAL </text>
  <text x="" y="1164.89"  class="fil0 fnt0">ARTIST ANDY JAVIER BRAVO CASTAÑO (DITO).WORKING BETWEEN </text>
  <text x="" y="1705.38"  class="fil0 fnt0">DOCUMENTARY PHOTOGRAPHY AND PAINTERLY INTERVENTION, HE </text>
  <text x="" y="2245.86"  class="fil0 fnt0">TRANSFORMS FRAGMENTS OF BELGRADE INTO REFLECTIONS ON </text>
  <text x="" y="2786.34"  class="fil0 fnt0">MEMORY, PERCEPTION, AND HUMAN EXPERIENCE.BORN FROM A </text>
  <text x="" y="3326.82"  class="fil0 fnt0">JOURNEY BETWEEN CUBA AND SERBIA, HIS WORK EXPLORES HOW </text>
  <text x="" y="3867.3"  class="fil0 fnt0">REALITY CAN BE REIMAGINED — TURNING WOUNDS INTO COLOR, </text>
  <text x="" y="4407.78"  class="fil0 fnt0">EXPERIENCE INTO AWARENESS, AND OBSERVATION INTO </text>
  <text x="" y="4948.26"  class="fil0 fnt0">TRANSFORMATION.A DOCUMENTED REALITY. A TRANSFORMED </text>
  <text x="" y="5488.75"  class="fil0 fnt0">MEMORY. AN ALTERED PERCEPTION.</text>
 </g>
</svg>
